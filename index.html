<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreetEats — see what's open around you</title>
<style>
  :root {
    --cream: #F0ECE0;
    --surface: #FFFDF6;
    --ink: #23201A;
    --body: #3A362D;
    --green: #1C3A2F;
    --paprika: #C4552B;
    --butter: #F9CF66;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    color: var(--body);
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  main {
    max-width: 420px;
    text-align: center;
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--green);
    padding: 2.5rem 2rem;
  }
  .badge {
    display: inline-block;
    background: var(--butter);
    border: 2px solid var(--ink);
    padding: .2rem .7rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 1.2rem;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    font-size: 1.7rem;
    line-height: 1.3;
    margin-bottom: .8rem;
  }
  p { margin-bottom: 1.4rem; line-height: 1.6; }
  a.policy { color: var(--paprika); font-weight: 600; }
</style>
</head>
<body>
<main>
  <span class="badge">StreetEats</span>
  <h1>See what's open around you.</h1>
  <p>A live map of street food vendors in the UK. Currently in invite-only beta with hand-picked vendors in the South East.</p>
  <p><a class="policy" href="privacy.html">Privacy Policy</a> &nbsp;·&nbsp; <a class="policy" href="mailto:streeteats.support@gmail.com">Contact</a></p>
</main>
</body>
</html>
